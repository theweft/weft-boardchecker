# Built-in parts library. Each entry maps a part number to its bus pins, how its address is set,
# and which device tree properties refer to which of its pins.
#
# - `mpn`: part number prefixes. Pinouts depend on the package, so prefixes include the package
#   code where a part comes in several packages.
# - `pins`: pin role -> pin number in that package. Roles `vdd` and `gnd` are used to resolve
#   address straps; bus roles are sda/scl (I2C) or sck/mosi/miso/cs (SPI, mosi = device input).
# - `address` (I2C only): fixed, strap (one pin, four levels) or bits (one pin per address bit).
# - `gpios`: device tree property -> pin role, checked against the GPIO the overlay names.
#   `interrupts` means interrupt-parent + interrupts (or interrupts-extended).
#
# Add parts from their datasheets. Unknown parts on a bus are reported as warnings, never ignored.

[[part]]
name = "TI ADS1115, VSSOP-10"
mpn = ["ADS1115IDGS"]
compatible = ["ti,ads1115"]
bus = "i2c"
pins = { addr = "1", alert = "2", gnd = "3", vdd = "8", sda = "9", scl = "10" }
address = { kind = "strap", pin = "addr", levels = { gnd = 0x48, vdd = 0x49, sda = 0x4a, scl = 0x4b } }
gpios = { interrupts = "alert" }

[[part]]
name = "Microchip MCP4728, MSOP-10"
mpn = ["MCP4728"]
compatible = ["microchip,mcp4728"]
bus = "i2c"
pins = { vdd = "1", scl = "2", sda = "3", ldac = "4", rdy = "5", gnd = "10" }
# Address bits live in the chip's EEPROM; 0x60 is the factory default.
address = { kind = "fixed", value = 0x60 }

[[part]]
name = "24C32 EEPROM, 8-pin SOIC/TSSOP/MSOP/DIP (not SOT-23-5)"
mpn = ["24LC32A", "24AA32A", "AT24C32", "CAT24C32", "M24C32"]
compatible = ["atmel,24c32"]
bus = "i2c"
pins = { a0 = "1", a1 = "2", a2 = "3", gnd = "4", sda = "5", scl = "6", wp = "7", vdd = "8" }
address = { kind = "bits", base = 0x50, pins = ["a2", "a1", "a0"] }
